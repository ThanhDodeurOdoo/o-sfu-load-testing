name: Nightly load

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      comparison_revision:
        description: Full o-sfu commit SHA to compare
        required: false
        type: string
      baseline_revision:
        description: Full baseline SHA or empty for current master
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-load
  cancel-in-progress: false

jobs:
  load:
    outputs:
      profile_summary_artifact_id: ${{ steps.profile-summary-artifact.outputs.artifact-id }}
      profile_summary_artifact_name: ${{ steps.profile-summary.outputs.artifact_name }}
      profile_summary_attempt: ${{ steps.profile-summary.outputs.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup toolchain install nightly-2026-04-20 --profile minimal --component rustfmt

      - name: Resolve o-sfu revisions
        id: revisions
        env:
          BASELINE_INPUT: ${{ inputs.baseline_revision }}
          COMPARISON_INPUT: ${{ inputs.comparison_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          normalize_sha() {
            local label=$1
            local revision=$2
            if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$label must be one full 40-character commit SHA" >&2
              exit 1
            fi
            printf '%s' "$revision" | tr 'A-F' 'a-f'
          }

          resolve_commit() {
            local label=$1
            local revision=$2
            local resolved
            revision=$(normalize_sha "$label" "$revision")
            resolved=$(gh api \
              "repos/ThanhDodeurOdoo/o-sfu/git/commits/$revision" \
              --jq .sha)
            if [[ "$resolved" != "$revision" ]]; then
              echo "$label did not resolve to the requested o-sfu commit" >&2
              exit 1
            fi
            printf '%s' "$resolved"
          }

          if [[ -n "$BASELINE_INPUT" && -z "$COMPARISON_INPUT" ]]; then
            echo "baseline_revision requires comparison_revision" >&2
            exit 1
          fi

          master=$(gh api \
            repos/ThanhDodeurOdoo/o-sfu/git/ref/heads/master \
            --jq .object.sha)
          master=$(resolve_commit "o-sfu master" "$master")

          if [[ -z "$COMPARISON_INPUT" ]]; then
            mode=single
            baseline=$master
            comparison=
            artifact_name=nightly-load-results
          else
            mode=comparison
            comparison=$(resolve_commit \
              "comparison_revision" "$COMPARISON_INPUT")
            if [[ -n "$BASELINE_INPUT" ]]; then
              baseline=$(resolve_commit \
                "baseline_revision" "$BASELINE_INPUT")
            else
              baseline=$master
            fi
            if [[ "$baseline" == "$comparison" ]]; then
              echo "baseline and comparison revisions must differ" >&2
              exit 1
            fi
            artifact_name=nightly-load-comparison-results
          fi

          {
            echo "mode=$mode"
            echo "baseline_revision=$baseline"
            echo "comparison_revision=$comparison"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build isolated processes
        env:
          BASELINE_REVISION: ${{ steps.revisions.outputs.baseline_revision }}
          COMPARISON_REVISION: ${{ steps.revisions.outputs.comparison_revision }}
          MODE: ${{ steps.revisions.outputs.mode }}
        run: |
          set -euo pipefail

          verify_lock() {
            local expected=$1
            local revisions
            revisions=$(awk '
              index($0, "source = \"git+https://github.com/ThanhDodeurOdoo/o-sfu") == 1 {
                split($0, parts, "#")
                revision = parts[length(parts)]
                sub(/\"$/, "", revision)
                print revision
              }
            ' Cargo.lock | sort -u)
            if [[ "$revisions" != "$expected" ]]; then
              echo "Cargo.lock resolved unexpected o-sfu revisions:" >&2
              echo "$revisions" >&2
              return 1
            fi
          }

          build_variant() {
            local revision=$1
            local target_directory=$2
            local lock_path=$3
            cargo update -p o-sfu --precise "$revision"
            verify_lock "$revision"
            mkdir -p "$(dirname "$lock_path")"
            cp Cargo.lock "$lock_path"
            CARGO_TARGET_DIR="$target_directory" \
              cargo build --locked --release --bins
          }

          if [[ "$MODE" == single ]]; then
            cargo update -p o-sfu --precise "$BASELINE_REVISION"
            verify_lock "$BASELINE_REVISION"
            cargo build --locked --release --bins
          else
            build_variant "$BASELINE_REVISION" \
              target/baseline artifacts/baseline/Cargo.lock
            build_variant "$COMPARISON_REVISION" \
              target/comparison artifacts/comparison/Cargo.lock
          fi

      - name: Check runner isolation
        run: |
          logical_cpus=$(nproc)
          if (( logical_cpus < 4 )); then
            echo "nightly load requires at least four logical CPUs, found $logical_cpus" >&2
            exit 1
          fi
          taskset --cpu-list 0 true
          taskset --cpu-list 1-3 true

      - name: Run deterministic load profiles
        env:
          MODE: ${{ steps.revisions.outputs.mode }}
        run: |
          status=0

          run_load() {
            local target_directory=$1
            local output=$2
            shift 2
            if ! "$target_directory/release/o-sfu-load" \
              --server-binary "$target_directory/release/o-sfu-load-server" \
              --rtc-binary "$target_directory/release/o-sfu-load-rtc" \
              --server-cpus 0 \
              --rtc-cpus 1-3 \
              --output "$output" \
              "$@"; then
              status=1
              return 1
            fi
          }

          run_profiles() {
            local run_profile=$1
            "$run_profile" audio-1x8 \
              audio-mesh --rooms 1 --peers 8 --seconds 30 || return 1
            "$run_profile" audio-2x12 \
              audio-mesh --rooms 2 --peers 12 --seconds 60 || return 1
            "$run_profile" audio-3x12 \
              audio-mesh --rooms 3 --peers 12 --seconds 120 || return 1
            "$run_profile" audio-1x28 \
              audio-mesh --rooms 1 --peers 28 --seconds 120 || return 1
            "$run_profile" video-1x12 \
              video-gallery --rooms 1 --peers 12 --publishers 4 --seconds 30 || return 1
            "$run_profile" video-1x64 \
              video-gallery --rooms 1 --peers 64 --publishers 10 --seconds 60 || return 1
          }

          run_single_profile() {
            local name=$1
            shift
            run_load target "artifacts/$name" "$@"
          }

          run_comparison_profile() {
            local name=$1
            shift
            run_load target/baseline "artifacts/baseline/$name" "$@" || return 1
            run_load target/comparison "artifacts/comparison/$name" "$@"
          }

          if [[ "$MODE" == single ]]; then
            run_profiles run_single_profile || status=1
          else
            run_profiles run_comparison_profile || status=1
          fi

          exit "$status"

      - name: Prepare CPU profiler
        id: profiler
        if: success()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          log=artifacts/profile-availability.txt
          available=false

          prepare_perf() {
            if ! perf version; then
              sudo apt-get update || return 1
              sudo apt-get install -y \
                linux-tools-common "linux-tools-$(uname -r)" || \
                sudo apt-get install -y linux-tools-common linux-tools-azure || \
                return 1
            fi
            if ! perf version; then
              local perf_directory="$RUNNER_TEMP/o-sfu-profile-bin"
              local perf_binary
              perf_binary=$(find /usr/lib/linux-tools \
                -type f -name perf -perm -111 | sort -V | tail -n 1)
              [[ -n "$perf_binary" ]] || return 1
              mkdir -p "$perf_directory" || return 1
              ln -sf "$perf_binary" "$perf_directory/perf" || return 1
              export PATH="$perf_directory:$PATH"
              echo "$perf_directory" >> "$GITHUB_PATH" || return 1
            fi
            sudo sysctl -w kernel.perf_event_paranoid=-1 || return 1
            sudo sysctl -w kernel.kptr_restrict=0 || return 1
            perf version || return 1
            perf record \
              --event cpu-clock \
              --freq 99 \
              --call-graph fp \
              --strict-freq \
              --output "$RUNNER_TEMP/o-sfu-perf-probe.data" \
              -- sleep 1 || return 1
            perf report \
              --stdio \
              --header-only \
              --input "$RUNNER_TEMP/o-sfu-perf-probe.data" || return 1
            if ! command -v rsvg-convert > /dev/null; then
              sudo apt-get update || return 1
              sudo apt-get install -y librsvg2-bin || return 1
            fi
            rsvg-convert --version || return 1
            local inferno_root="$RUNNER_TEMP/inferno-0.12.8"
            cargo install inferno \
              --version 0.12.8 \
              --locked \
              --root "$inferno_root" \
              --no-default-features \
              --features cli \
              --bin inferno-collapse-perf \
              --bin inferno-flamegraph || return 1
            export PATH="$inferno_root/bin:$PATH"
            echo "$inferno_root/bin" >> "$GITHUB_PATH" || return 1
            echo 'O_SFU_LOAD_INFERNO_VERSION=0.12.8' >> "$GITHUB_ENV" || \
              return 1
            inferno-collapse-perf --help > /dev/null || return 1
            inferno-flamegraph --help > /dev/null || return 1
          }

          if prepare_perf > "$log" 2>&1; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          cat "$log"
          if [[ "$available" != true ]]; then
            echo "::warning::The CPU profiler is unavailable. The load results remain valid but this run has no CPU profile."
          else
            cargo_home=$(dirname "$(dirname "$(command -v cargo)")")
            inferno_license=$(find "$cargo_home/registry/src" \
              -path '*/inferno-0.12.8/LICENSE' -print -quit)
            if [[ -n "$inferno_license" ]]; then
              cp "$inferno_license" artifacts/INFERNO-LICENSE || \
                echo "::warning::Could not retain the Inferno license in the artifact."
            fi
          fi

      - name: Build profiling server
        id: profile-build
        if: steps.profiler.outputs.available == 'true'
        continue-on-error: true
        env:
          BASELINE_REVISION: ${{ steps.revisions.outputs.baseline_revision }}
          COMPARISON_REVISION: ${{ steps.revisions.outputs.comparison_revision }}
          MODE: ${{ steps.revisions.outputs.mode }}
        run: |
          set -uo pipefail

          original_lock="$RUNNER_TEMP/o-sfu-load-Cargo.lock"
          cp Cargo.lock "$original_lock" || exit 1
          restore_lock() {
            cp "$original_lock" Cargo.lock
          }
          trap restore_lock EXIT

          verify_lock() {
            local expected=$1
            local revisions
            revisions=$(awk '
              index($0, "source = \"git+https://github.com/ThanhDodeurOdoo/o-sfu") == 1 {
                split($0, parts, "#")
                revision = parts[length(parts)]
                sub(/\"$/, "", revision)
                print revision
              }
            ' Cargo.lock | sort -u) || return 1
            if [[ "$revisions" != "$expected" ]]; then
              echo "Cargo.lock resolved unexpected o-sfu revisions:" >&2
              echo "$revisions" >&2
              return 1
            fi
          }

          build_profile_server() {
            local revision=$1
            local target_directory=$2
            local lock=$3
            cp "$lock" Cargo.lock || return 1
            verify_lock "$revision" || return 1
            CARGO_TARGET_DIR="$target_directory" \
              CARGO_PROFILE_RELEASE_DEBUG=1 \
              CARGO_PROFILE_RELEASE_STRIP=none \
              RUSTFLAGS='-Cforce-frame-pointers=yes -Clink-arg=-Wl,--no-rosegment' \
              cargo build --locked --release --bin o-sfu-load-server || return 1
          }

          status=0
          if [[ "$MODE" == single ]]; then
            build_profile_server "$BASELINE_REVISION" \
              target/profile "$original_lock" || status=1
          else
            build_profile_server "$BASELINE_REVISION" \
              target/profile-baseline artifacts/baseline/Cargo.lock || status=1
            build_profile_server "$COMPARISON_REVISION" \
              target/profile-comparison artifacts/comparison/Cargo.lock || status=1
          fi

          restore_lock || status=1
          trap - EXIT
          exit "$status"

      - name: Capture CPU profiles
        id: cpu-profile
        if: steps.profiler.outputs.available == 'true'
        continue-on-error: true
        env:
          MODE: ${{ steps.revisions.outputs.mode }}
        run: |
          set -uo pipefail
          status=0

          capture_profile() {
            local run_directory=$1
            local profile_directory=$2
            local output=$3
            local lock=$4
            [[ -x "$profile_directory/release/o-sfu-load-server" ]] || return 1
            mkdir -p "$output" || return 1
            cp "$profile_directory/release/o-sfu-load-server" \
              "$output/o-sfu-load-server" || return 1
            cp "$lock" "$output/Cargo.lock" || return 1
            "$run_directory/release/o-sfu-load" \
              --server-binary "$profile_directory/release/o-sfu-load-server" \
              --rtc-binary "$run_directory/release/o-sfu-load-rtc" \
              --server-cpus 0 \
              --rtc-cpus 1-3 \
              --profile-server \
              --output "$output" \
              audio-mesh --rooms 1 --peers 28 --seconds 120 || return 1
            "$run_directory/release/o-sfu-load-profile" \
              prepare --input "$output" || return 1
          }

          capture_with_log() {
            local output=$3
            mkdir -p "$output" || return 1
            if capture_profile "$@" > "$output/profile-workflow.log" 2>&1; then
              cat "$output/profile-workflow.log"
              echo AVAILABLE > "$output/profile-status.txt"
              return 0
            else
              local capture_status=$?
              cat "$output/profile-workflow.log"
              echo UNAVAILABLE > "$output/profile-status.txt"
              return "$capture_status"
            fi
          }

          render_preview() {
            local source=$1
            local output=$2
            local temporary="${output}.tmp"
            if rsvg-convert --width 1800 \
              --output "$temporary" "$source"; then
              mv "$temporary" "$output"
            else
              rm -f "$temporary"
              return 1
            fi
          }

          if [[ "$MODE" == single ]]; then
            capture_with_log target target/profile \
              artifacts/profile/audio-1x28 Cargo.lock || status=1
            if [[ -s artifacts/profile/audio-1x28/profile.ready ]]; then
              render_preview \
                artifacts/profile/audio-1x28/flamegraph.svg \
                artifacts/o-sfu-flamegraph.png || status=1
            fi
          else
            capture_with_log target/baseline target/profile-baseline \
              artifacts/profile/baseline/audio-1x28 \
              artifacts/baseline/Cargo.lock || status=1
            capture_with_log target/comparison target/profile-comparison \
              artifacts/profile/comparison/audio-1x28 \
              artifacts/comparison/Cargo.lock || status=1
            if [[ -s artifacts/profile/baseline/audio-1x28/profile.ready ]]; then
              render_preview \
                artifacts/profile/baseline/audio-1x28/flamegraph.svg \
                artifacts/o-sfu-flamegraph-baseline.png || status=1
            fi
            if [[ -s artifacts/profile/comparison/audio-1x28/profile.ready ]]; then
              render_preview \
                artifacts/profile/comparison/audio-1x28/flamegraph.svg \
                artifacts/o-sfu-flamegraph-comparison.png || status=1
            fi
          fi

          exit "$status"

      - name: Upload load artifacts
        id: load-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.revisions.outputs.artifact_name }}
          path: |
            artifacts
            Cargo.lock
          if-no-files-found: warn
          retention-days: 30

      - name: Publish load summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.load-artifact.outputs.artifact-url }}
          MODE: ${{ steps.revisions.outputs.mode }}
        run: |
          mkdir -p artifacts
          summary=artifacts/summary.md
          if [[ "$MODE" == comparison ]]; then
            reporter=target/baseline/release/o-sfu-load-report
          else
            reporter=target/release/o-sfu-load-report
          fi

          if [[ -x "$reporter" ]]; then
            if [[ "$MODE" == comparison ]]; then
              args=(
                --baseline-input artifacts/baseline/audio-1x8
                --baseline-input artifacts/baseline/audio-2x12
                --baseline-input artifacts/baseline/audio-3x12
                --baseline-input artifacts/baseline/audio-1x28
                --baseline-input artifacts/baseline/video-1x12
                --baseline-input artifacts/baseline/video-1x64
                --comparison-input artifacts/comparison/audio-1x8
                --comparison-input artifacts/comparison/audio-2x12
                --comparison-input artifacts/comparison/audio-3x12
                --comparison-input artifacts/comparison/audio-1x28
                --comparison-input artifacts/comparison/video-1x12
                --comparison-input artifacts/comparison/video-1x64
                --output "$summary"
              )
            else
              args=(
                --input artifacts/audio-1x8
                --input artifacts/audio-2x12
                --input artifacts/audio-3x12
                --input artifacts/audio-1x28
                --input artifacts/video-1x12
                --input artifacts/video-1x64
                --output "$summary"
              )
            fi
            if [[ -n "$ARTIFACT_URL" ]]; then
              args+=(--artifact-url "$ARTIFACT_URL")
            fi
            "$reporter" "${args[@]}"
          elif [[ "$MODE" == comparison ]]; then
            echo '# o-sfu revision comparison' > "$summary"
            echo >> "$summary"
            echo 'No comparison result was available.' >> "$summary"
          else
            echo '# o-sfu load report' > "$summary"
            echo >> "$summary"
            echo 'No load scenario produced a result.' >> "$summary"
          fi

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare CPU profile summary
        id: profile-summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.load-artifact.outputs.artifact-url }}
          MODE: ${{ steps.revisions.outputs.mode }}
          PROFILER_AVAILABLE: ${{ steps.profiler.outputs.available }}
          PROFILE_BUILD_OUTCOME: ${{ steps.profile-build.outcome }}
          PROFILE_RUN_OUTCOME: ${{ steps.cpu-profile.outcome }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/load-test-assets
        run: |
          set -euo pipefail
          mkdir -p artifacts
          publication=artifacts/profile-publication.md
          : > "$publication"
          handoff_name="profile-summary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          single_asset="o-sfu-flamegraph-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.png"
          baseline_asset="o-sfu-flamegraph-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.png"
          comparison_asset="o-sfu-flamegraph-comparison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.png"
          single_url=
          baseline_url=
          comparison_url=
          if [[ -s artifacts/o-sfu-flamegraph.png ]]; then
            cp artifacts/o-sfu-flamegraph.png "artifacts/$single_asset"
            single_url="$RELEASE_URL/$single_asset"
          fi
          if [[ -s artifacts/o-sfu-flamegraph-baseline.png ]]; then
            cp artifacts/o-sfu-flamegraph-baseline.png "artifacts/$baseline_asset"
            baseline_url="$RELEASE_URL/$baseline_asset"
          fi
          if [[ -s artifacts/o-sfu-flamegraph-comparison.png ]]; then
            cp artifacts/o-sfu-flamegraph-comparison.png "artifacts/$comparison_asset"
            comparison_url="$RELEASE_URL/$comparison_asset"
          fi

          publish_profile() {
            local reporter=$1
            local input=$2
            local heading=$3
            local summary=$4
            local flamegraph_url=$5
            local args=(
              report
              --input "$input"
              --output "$summary"
            )
            if [[ -n "$ARTIFACT_URL" ]]; then
              args+=(--artifact-url "$ARTIFACT_URL")
            fi
            if [[ -n "$flamegraph_url" ]]; then
              args+=(--flamegraph-url "$flamegraph_url")
            fi
            if [[ -x "$reporter" && -s "$input/profile.ready" ]] && \
              "$reporter" "${args[@]}"; then
              if [[ -n "$heading" ]]; then
                echo "$heading" >> "$publication"
                echo >> "$publication"
                if [[ "$heading" == '## '* ]]; then
                  sed -e '1d' -e 's/^## /### /' "$summary" >> "$publication"
                else
                  tail -n +2 "$summary" >> "$publication"
                fi
              else
                cat "$summary" >> "$publication"
              fi
              return
            fi
            {
              echo "$heading"
              echo
              echo '| Profile | Profiler available | Build | Capture |'
              echo '| --- | --- | --- | --- |'
              echo "| UNAVAILABLE | ${PROFILER_AVAILABLE:-false} | ${PROFILE_BUILD_OUTCOME:-skipped} | ${PROFILE_RUN_OUTCOME:-skipped} |"
              echo
              echo 'The artifact retains profiler diagnostics when capture was attempted.'
              echo
            } >> "$publication"
          }

          if [[ "$MODE" == comparison ]]; then
            {
              echo '# o-sfu CPU profiles'
              echo
            } >> "$publication"
            publish_profile \
              target/baseline/release/o-sfu-load-profile \
              artifacts/profile/baseline/audio-1x28 \
              '## Baseline revision' \
              artifacts/profile-baseline-summary.md \
              "$baseline_url"
            publish_profile \
              target/comparison/release/o-sfu-load-profile \
              artifacts/profile/comparison/audio-1x28 \
              '## Comparison revision' \
              artifacts/profile-comparison-summary.md \
              "$comparison_url"
          else
            publish_profile \
              target/release/o-sfu-load-profile \
              artifacts/profile/audio-1x28 \
              '# o-sfu CPU profile' \
              artifacts/profile-summary.md \
              "$single_url"
          fi
          echo "artifact_name=$handoff_name" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload CPU profile summary handoff
        id: profile-summary-artifact
        if: always() && hashFiles('artifacts/profile-publication.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.profile-summary.outputs.artifact_name }}
          path: |
            artifacts/profile-publication.md
            artifacts/o-sfu-flamegraph-${{ github.run_id }}-${{ github.run_attempt }}.png
            artifacts/o-sfu-flamegraph-baseline-${{ github.run_id }}-${{ github.run_attempt }}.png
            artifacts/o-sfu-flamegraph-comparison-${{ github.run_id }}-${{ github.run_attempt }}.png
          if-no-files-found: error
          retention-days: 30

  publish-profile:
    name: Publish CPU profile summary
    needs: load
    if: ${{ always() && needs.load.outputs.profile_summary_artifact_id != '' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download CPU profile summary handoff
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_NAME: ${{ needs.load.outputs.profile_summary_artifact_name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$HANDOFF_NAME" \
            --dir handoff

      - name: Publish public flamegraph previews
        id: flamegraph-publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_ATTEMPT: ${{ needs.load.outputs.profile_summary_attempt }}
        run: |
          set -euo pipefail
          summary=handoff/profile-publication.md
          [[ -s "$summary" ]] || {
            echo 'The CPU profile summary handoff is empty.' >&2
            exit 1
          }

          shopt -s nullglob
          pngs=(handoff/o-sfu-flamegraph-*.png)

          single="o-sfu-flamegraph-${GITHUB_RUN_ID}-${PROFILE_ATTEMPT}.png"
          baseline="o-sfu-flamegraph-baseline-${GITHUB_RUN_ID}-${PROFILE_ATTEMPT}.png"
          comparison="o-sfu-flamegraph-comparison-${GITHUB_RUN_ID}-${PROFILE_ATTEMPT}.png"
          for file in "${pngs[@]}"; do
            name=${file##*/}
            case "$name" in
              "$single"|"$baseline"|"$comparison") ;;
              *)
                echo "Unexpected flamegraph asset: $name" >&2
                exit 1
                ;;
            esac
            signature=$(od -An -tx1 -N8 "$file" | tr -d '[:space:]')
            [[ "$signature" == 89504e470d0a1a0a ]] || {
              echo "$name is not a PNG." >&2
              exit 1
            }
            size=$(stat -c %s "$file")
            (( size >= 1024 && size <= 10485760 )) || {
              echo "$name has an unexpected size: $size bytes" >&2
              exit 1
            }
          done

          release=load-test-assets
          release_response="$RUNNER_TEMP/load-test-assets.json"
          release_status=$(curl --silent --show-error \
            --output "$release_response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$release")
          case "$release_status" in
            200)
              release_id=$(jq -er '.id | numbers' "$release_response")
              ;;
            404)
              if (( ${#pngs[@]} == 0 )); then
                exit 0
              fi
              gh release create "$release" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title 'Nightly load-test visuals' \
                --notes 'Run-specific previews for GitHub Actions summaries. Later runs remove assets older than 30 days.' \
                --prerelease \
                --latest=false
              release_id=$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/tags/$release" \
                --jq .id)
              ;;
            *)
              echo "GitHub returned HTTP $release_status while resolving the preview release." >&2
              exit 1
              ;;
          esac

          cutoff=$(date -u -d '30 days ago' +%s)
          asset_rows=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, .created_at] | @tsv')
          while IFS=$'\t' read -r asset_id name created_at; do
            if [[ ! "$name" =~ ^o-sfu-flamegraph(-(baseline|comparison))?-[0-9]+-[0-9]+\.png$ ]]; then
              continue
            fi
            created=$(date -u -d "$created_at" +%s)
            if (( created < cutoff )); then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
            fi
          done <<< "$asset_rows"

          for file in "${pngs[@]}"; do
            name=${file##*/}
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$release/$name"
            uploaded=false
            matching_assets=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | [.id, .state] | @tsv")
            while IFS=$'\t' read -r asset_id state; do
              [[ -n "$asset_id" ]] || continue
              case "$state" in
                starter)
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
                  ;;
                uploaded)
                  uploaded=true
                  ;;
                *)
                  echo "$name has an unexpected release asset state: $state" >&2
                  exit 1
                  ;;
              esac
            done <<< "$matching_assets"
            if [[ "$uploaded" == false ]]; then
              gh release upload "$release" "$file" --repo "$GITHUB_REPOSITORY"
            fi
            downloaded="$RUNNER_TEMP/$name"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$downloaded" "$url"
            cmp --silent "$file" "$downloaded" || {
              echo "$name differs from its public release asset." >&2
              exit 1
            }
          done

      - name: Publish CPU profile summary
        if: always()
        env:
          FLAMEGRAPH_PUBLICATION: ${{ steps.flamegraph-publication.outcome }}
        run: |
          set -euo pipefail
          summary=handoff/profile-publication.md
          if [[ ! -s "$summary" ]]; then
            echo '# o-sfu CPU profile' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'The profile summary handoff is unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$FLAMEGRAPH_PUBLICATION" != success ]]; then
            echo '> Flamegraph preview publication failed. The profile breakdown remains valid. Use the workflow artifact for the interactive SVG.' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            sed \
              -e '/^\[!\[o-sfu CPU flamegraph\]/d' \
              -e '/^The embedded PNG is a static preview\./d' \
              "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
