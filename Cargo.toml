[package]
name = "o-sfu-load-testing"
description = "External load harness for o-sfu"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
default-run = "o-sfu-load"

[workspace]
resolver = "3"

[workspace.package]
authors = ["ThanhDodeurOdoo"]
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
repository = "https://github.com/ThanhDodeurOdoo/o-sfu-load-testing"
rust-version = "1.95"
version = "0.1.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
o-sfu = { git = "https://github.com/ThanhDodeurOdoo/o-sfu", branch = "master" }
o-sfu-protocol = { git = "https://github.com/ThanhDodeurOdoo/o-sfu", branch = "master" }
o-sfu-rfc = { git = "https://github.com/ThanhDodeurOdoo/o-sfu", branch = "master" }
plotters = { version = "=0.3.7", default-features = false, features = [
    "line_series",
    "svg_backend",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
str0m = { version = "0.21", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1.52", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = "0.30"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(kani)",
    "cfg(rust_analyzer)",
] }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
indexing_slicing = { level = "deny", priority = -1 }
panic = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = { level = "deny", priority = -1 }

complexity = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"

absolute_paths = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
exit = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
non_ascii_literal = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
wildcard_dependencies = "warn"

needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_if_let_else = "warn"
redundant_clone = "warn"
significant_drop_tightening = "warn"
single_option_map = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"

[[bin]]
name = "o-sfu-load"
path = "src/bin/o-sfu-load.rs"

[[bin]]
name = "o-sfu-load-server"
path = "src/bin/o-sfu-load-server.rs"

[[bin]]
name = "o-sfu-load-rtc"
path = "src/bin/o-sfu-load-rtc.rs"

[[bin]]
name = "o-sfu-load-report"
path = "src/bin/o-sfu-load-report.rs"

[[bin]]
name = "o-sfu-load-profile"
path = "src/bin/o-sfu-load-profile.rs"
